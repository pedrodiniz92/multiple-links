<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch it!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Include Quill stylesheet and library -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Auth links are now inside the toolbar -->
    <div id="left-panel">
        <div class="header-container">
            <div class="title-container">
                <h1>
                    <span class="title-text">Watch it!</span>
                </h1>
                <h2 class="attribution">
                    built by <a href="https://www.linkedin.com/in/pedro-diniz-619733a2/" target="_blank">Pedro Diniz</a>
                </h2>
            </div>
            <!-- Auth links -->
            <div class="auth-links">
                <a href="test/signin.html">Sign in</a>
                <a href="test/signup.html">Sign up</a>
            </div>
        </div>
        <div class="toolbar-container">
            <div class="toolbar-group">
                <button class="toolbar-icon" id="edit-text-icon">
                    <img src="icons/pen.svg" alt="Edit text" width="20" height="20">
                    <span class="custom-tooltip">Edit text</span>
                </button>
                <!-- Save button commented out -->
                <!--
                <button class="toolbar-icon">
                    <img src="icons/floppy.svg" alt="Save" width="20" height="20">
                    <span class="custom-tooltip">Save</span>
                </button>
                -->
                <!-- Open button commented out -->
                <!--
                <button class="toolbar-icon">
                    <img src="icons/folder.svg" alt="Open" width="20" height="20">
                    <span class="custom-tooltip">Open</span>
                </button>
                -->
                <button class="toolbar-icon" id="share-icon">
                    <img src="icons/link.svg" alt="Share" width="20" height="20">
                    <span class="custom-tooltip">Share</span>
                    <div id="clipboard-feedback">Link copied!</div>
                </button>
            </div>
            <div class="toolbar-separator"></div>
            <div class="toolbar-group">
                <!-- New document button commented out -->
                <!--
                <button class="toolbar-icon">
                    <img src="icons/new-file.svg" alt="New document" width="20" height="20">
                    <span class="custom-tooltip">New document</span>
                </button>
                -->
                <button class="toolbar-icon" id="theme-toggle-icon">
                    <img src="icons/sun.svg" alt="Light mode" width="20" height="20" class="theme-icon-dark">
                    <img src="icons/moon.svg" alt="Dark mode" width="20" height="20" class="theme-icon-light">
                    <span class="custom-tooltip theme-tooltip">Dark mode</span>
                </button>
            </div>
        </div>
        <!-- Edit share container removed as functionality is now in the icons -->
        <div class="input-section">
            <!-- Editor tooltip removed -->
            <div id="editor-container">
                <div id="editor-toolbar">
                    <span class="ql-formats">
                        <button class="ql-bold quill-button" title="Bold">
                            <span class="custom-tooltip">Bold</span>
                        </button>
                        <button class="ql-italic quill-button" title="Italic">
                            <span class="custom-tooltip">Italic</span>
                        </button>
                        <button class="ql-underline quill-button" title="Underline">
                            <span class="custom-tooltip">Underline</span>
                        </button>
                        <button class="ql-strike quill-button" title="Strikethrough">
                            <span class="custom-tooltip">Strikethrough</span>
                        </button>
                        <span class="quill-select-container">
                            <select class="ql-color" title="Text Color"></select>
                            <span class="custom-tooltip">Text Color</span>
                        </span>
                        <span class="quill-select-container">
                            <select class="ql-background" title="Background Color"></select>
                            <span class="custom-tooltip">Background Color</span>
                        </span>
                        <button id="add-youtube-link" class="quill-button" title="Add YouTube Link">
                            <svg viewBox="0 0 24 24" width="18" height="18">
                                <path fill="currentColor" d="M10,15L15.19,12L10,9V15M21.56,7.17C21.69,7.64 21.78,8.27 21.84,9.07C21.91,9.87 21.94,10.56 21.94,11.16L22,12C22,14.19 21.84,15.8 21.56,16.83C21.31,17.73 20.73,18.31 19.83,18.56C19.36,18.69 18.5,18.78 17.18,18.84C15.88,18.91 14.69,18.94 13.59,18.94L12,19C7.81,19 5.2,18.84 4.17,18.56C3.27,18.31 2.69,17.73 2.44,16.83C2.31,16.36 2.22,15.73 2.16,14.93C2.09,14.13 2.06,13.44 2.06,12.84L2,12C2,9.81 2.16,8.2 2.44,7.17C2.69,6.27 3.27,5.69 4.17,5.44C4.64,5.31 5.5,5.22 6.82,5.16C8.12,5.09 9.31,5.06 10.41,5.06L12,5C16.19,5 18.8,5.16 19.83,5.44C20.73,5.69 21.31,6.27 21.56,7.17Z" />
                            </svg>
                            <span class="custom-tooltip">Add YouTube Link</span>
                        </button>
                    </span>
                </div>
                <!-- Rich editor will be implemented in Step 11 -->
                <div id="rich-editor" style="display: none;"></div>
                <!-- Temporarily show textarea for testing until rich editor is implemented -->
                <textarea id="url-input" rows="6" style="width: 100%; padding: 10px;" placeholder="Enter URLs or text (one per line)"></textarea>
            </div>
            <div class="button-container">
                <button id="go-button">Go!</button>
            </div>
        </div>
        <div id="title-fetch-feedback">
            Title fetched successfully!
        </div>
        <div id="links-container"></div>
    </div>
    <div id="resizer"></div>
    <div id="right-panel">
        <iframe id="viewer" src="about:blank"></iframe>
    </div>
    
    <!-- Add YouTube Link Modal -->
    <div id="add-youtube-modal" class="modal">
        <div class="modal-content">
            <div id="modal-title-feedback">Title fetched successfully!</div>
            <div class="modal-header">
                <h3>Add YouTube Link</h3>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="youtube-url">YouTube URL:</label>
                    <input type="text" id="youtube-url" />
                </div>
                <div class="form-group context-group">
                    <label for="youtube-context">Context (optional):</label>
                    <div class="context-input-container">
                        <input type="text" id="youtube-context" placeholder="Use // for line breaks" />
                        <button type="button" id="add-linebreak-btn" class="secondary-button">Line break</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="youtube-title">Custom Title (optional):</label>
                    <div class="context-input-container">
                        <input type="text" id="youtube-title" />
                        <button type="button" id="fetch-youtube-title-btn" class="secondary-button">Fetch Title</button>
                    </div>
                </div>
                
                <div class="time-inputs">
                    <div class="form-group">
                        <label for="youtube-start-time">Start Time (optional):</label>
                        <input type="text" id="youtube-start-time" placeholder="e.g., 1:30" />
                        <p class="format-note">Format: MM:SS or H:MM:SS</p>
                    </div>
                    <div class="form-group">
                        <label for="youtube-end-time">End Time (optional):</label>
                        <input type="text" id="youtube-end-time" placeholder="e.g., 2:45" />
                        <p class="format-note">Format: MM:SS or H:MM:SS</p>
                    </div>
                </div>
                
                <div class="modal-actions">
                    <button id="insert-youtube-link-btn" class="primary-button">Insert</button>
                    <button id="cancel-youtube-link-btn" class="cancel-button">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js" type="module"></script>
</body>
</html>
