<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch it!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Include Quill stylesheet and library -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="left-panel">
        <h1>
            <span class="title-text">Watch it!</span>
            <div class="theme-toggle-container">
                <div class="theme-icon sun-icon" aria-hidden="true"></div>
                <div id="theme-toggle" title="Toggle dark mode"></div>
                <div class="theme-icon moon-icon" aria-hidden="true"></div>
            </div>
        </h1>
        <h2 class="attribution">
            built by <a href="https://www.linkedin.com/in/pedro-diniz-619733a2/" target="_blank">Pedro Diniz</a>
        </h2>
        <div class="edit-share-container">
            <button id="new-links-button">Edit Links</button>
            <button id="share-links-button">Link to share</button>
        </div>
        <div class="input-section">
            <div id="editor-tooltip" class="tooltip-text">
                Click the YouTube button in the toolbar to add a YouTube link with a custom title. Start lines with # for headers.
            </div>
            <div id="editor-container">
                <div id="editor-toolbar">
                    <span class="ql-formats">
                        <button class="ql-bold" title="Bold"></button>
                        <button class="ql-italic" title="Italic"></button>
                        <button class="ql-underline" title="Underline"></button>
                        <button class="ql-strike" title="Strikethrough"></button>
                    </span>
                    <span class="ql-formats">
                        <select class="ql-color" title="Text Color"></select>
                        <select class="ql-background" title="Background Color"></select>
                    </span>
                    <span class="ql-formats">
                        <button id="add-youtube-link" title="Add YouTube Link">
                            <svg viewBox="0 0 24 24" width="18" height="18">
                                <path fill="currentColor" d="M10,15L15.19,12L10,9V15M21.56,7.17C21.69,7.64 21.78,8.27 21.84,9.07C21.91,9.87 21.94,10.56 21.94,11.16L22,12C22,14.19 21.84,15.8 21.56,16.83C21.31,17.73 20.73,18.31 19.83,18.56C19.36,18.69 18.5,18.78 17.18,18.84C15.88,18.91 14.69,18.94 13.59,18.94L12,19C7.81,19 5.2,18.84 4.17,18.56C3.27,18.31 2.69,17.73 2.44,16.83C2.31,16.36 2.22,15.73 2.16,14.93C2.09,14.13 2.06,13.44 2.06,12.84L2,12C2,9.81 2.16,8.2 2.44,7.17C2.69,6.27 3.27,5.69 4.17,5.44C4.64,5.31 5.5,5.22 6.82,5.16C8.12,5.09 9.31,5.06 10.41,5.06L12,5C16.19,5 18.8,5.16 19.83,5.44C20.73,5.69 21.31,6.27 21.56,7.17Z" />
                            </svg>
                        </button>
                    </span>
                </div>
                <div id="rich-editor"></div>
                <!-- Hidden textarea for compatibility with existing code -->
                <textarea id="url-input" style="display: none;"></textarea>
            </div>
            <div class="button-container">
                <button id="go-button">Go!</button>
                <button id="get-link-button">Link to share</button>
            </div>
        </div>
        <div id="clipboard-feedback">
            Link copied to clipboard!
        </div>
        <div id="links-container"></div>
    </div>
    <div id="resizer"></div>
    <div id="right-panel">
        <iframe id="viewer" src="about:blank"></iframe>
    </div>
    
    <!-- Add YouTube Link Modal -->
    <div id="add-youtube-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add YouTube Link</h3>
                <button class="close-button" id="close-youtube-modal">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="youtube-url">YouTube URL:</label>
                    <input type="text" id="youtube-url" placeholder="https://www.youtube.com/watch?v=..." />
                </div>
                <div class="form-group">
                    <label for="youtube-context">Context (optional):</label>
                    <input type="text" id="youtube-context" placeholder="Enter context information" />
                </div>
                <div class="form-group">
                    <label for="youtube-title">Custom Title (optional):</label>
                    <input type="text" id="youtube-title" placeholder="Enter custom title for the video" />
                </div>
                
                <div class="time-inputs">
                    <div class="form-group">
                        <label for="youtube-start-time">Start Time (optional):</label>
                        <input type="text" id="youtube-start-time" placeholder="e.g., 1:30" />
                        <p class="format-note">Format: MM:SS or H:MM:SS</p>
                    </div>
                    <div class="form-group">
                        <label for="youtube-end-time">End Time (optional):</label>
                        <input type="text" id="youtube-end-time" placeholder="e.g., 2:45" />
                        <p class="format-note">Format: MM:SS or H:MM:SS</p>
                    </div>
                </div>
                
                <div class="modal-actions">
                    <button id="fetch-youtube-title-btn" class="secondary-button">Fetch Title</button>
                    <button id="insert-youtube-link-btn" class="primary-button">Insert</button>
                    <button id="cancel-youtube-link-btn" class="cancel-button">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
